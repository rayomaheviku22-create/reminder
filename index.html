<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Follow-ups</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Instrument Sans"', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Instrument Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F3F5F7',
            ink: '#16202B',
            muted: '#5B6775',
            line: '#DCE1E7',
            accent: { DEFAULT: '#0E5E5B', hover: '#0B4A48', soft: '#E3F0EF' },
          },
        },
      },
    };
  </script>
  <style>
    dialog::backdrop { background: rgba(22, 32, 43, 0.45); }
    dialog[open] { animation: pop .16s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
    .horizon::-webkit-scrollbar { height: 6px; }
    .horizon::-webkit-scrollbar-thumb { background: #cfd6de; border-radius: 3px; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .7; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="bg-canvas text-ink font-sans antialiased">

  <!-- ============================ Sign in ============================ -->
  <div id="loginView" class="hidden min-h-screen flex items-center justify-center p-6">
    <form id="loginForm" class="w-full max-w-sm bg-white rounded-2xl ring-1 ring-line p-8 shadow-sm">
      <div class="text-3xl mb-3" aria-hidden="true">📬</div>
      <h1 class="font-display text-2xl font-bold tracking-tight">Follow-ups</h1>
      <p class="text-muted text-sm mt-1 mb-6">Enter the dashboard password you set with <code class="text-ink">APP_PASSWORD</code>.</p>
      <label for="loginPassword" class="block text-sm font-medium mb-1.5">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required
        class="w-full rounded-lg border border-line px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
      <p id="loginError" class="hidden text-sm text-red-700 mt-2"></p>
      <button type="submit" class="mt-5 w-full rounded-lg bg-accent hover:bg-accent-hover text-white font-medium py-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-accent">
        Unlock dashboard
      </button>
    </form>
  </div>

  <!-- ============================ App ============================ -->
  <div id="appView" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-line">
      <div class="max-w-7xl mx-auto px-4 lg:px-6 h-16 flex items-center gap-3">
        <span class="text-2xl" aria-hidden="true">📬</span>
        <span class="font-display text-xl font-bold tracking-tight whitespace-nowrap">Follow-ups</span>
        <span id="todayLabel" class="hidden sm:inline text-sm text-muted ml-2"></span>
        <div class="ml-auto flex items-center gap-1 sm:gap-2">
          <button id="exportBtn" class="hidden sm:inline-flex items-center rounded-lg px-3 py-2 text-sm text-muted hover:text-ink hover:bg-canvas focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Export backup</button>
          <button id="lockBtn" class="inline-flex items-center rounded-lg px-3 py-2 text-sm text-muted hover:text-ink hover:bg-canvas focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Lock</button>
          <button id="newContactBtn" class="inline-flex items-center gap-1.5 rounded-lg bg-accent hover:bg-accent-hover text-white text-sm font-medium px-3.5 py-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-accent">
            <span aria-hidden="true" class="text-base leading-none">+</span> New<span class="hidden sm:inline">&nbsp;follow-up</span>
          </button>
        </div>
      </div>
    </header>

    <div class="flex-1 w-full max-w-7xl mx-auto px-4 lg:px-6 py-6 flex flex-col lg:flex-row gap-6">
      <!-- Profiles -->
      <aside class="lg:w-64 shrink-0">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-semibold text-muted">Support profiles</h2>
          <button id="newProfileBtn" class="text-sm font-medium text-accent hover:text-accent-hover rounded px-1.5 py-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Add</button>
        </div>
        <ul id="profileList" class="flex gap-2 overflow-x-auto pb-2 lg:pb-0 lg:flex-col lg:gap-1 lg:overflow-visible"></ul>
      </aside>

      <!-- Main -->
      <main class="flex-1 min-w-0">
        <section aria-labelledby="headline" class="mb-6">
          <h1 id="headline" class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight"></h1>
          <p id="subline" class="text-muted mt-1"></p>
          <div id="horizon" class="horizon mt-5 flex gap-2 overflow-x-auto pb-2" role="group" aria-label="Follow-ups by due date"></div>
        </section>

        <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
          <div class="self-start inline-flex rounded-lg bg-white ring-1 ring-line p-1 text-sm" role="tablist" aria-label="Status">
            <button data-status="active" class="status-tab px-3 py-1.5 rounded-md font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Open</button>
            <button data-status="archived" class="status-tab px-3 py-1.5 rounded-md font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">Archived</button>
          </div>
          <div id="filterChip" class="hidden"></div>
          <div class="sm:ml-auto relative">
            <input id="searchInput" type="search" placeholder="Search name, email, subject, notes"
              class="w-full sm:w-72 rounded-lg border border-line bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
          </div>
        </div>

        <div id="contactList" class="space-y-3"></div>
        <div id="emptyState" class="hidden"></div>
      </main>
    </div>
  </div>

  <!-- ============================ Profile dialog ============================ -->
  <dialog id="profileDialog" class="w-[calc(100%-2rem)] max-w-md rounded-2xl p-0 shadow-xl">
    <form id="profileForm" class="p-6">
      <h2 id="profileDialogTitle" class="font-display text-xl font-bold mb-4">New support profile</h2>
      <input type="hidden" name="id" />
      <label class="block text-sm font-medium mb-1.5" for="pf-name">Profile name</label>
      <input id="pf-name" name="name" required maxlength="120" placeholder="Company A support"
        class="w-full rounded-lg border border-line px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-accent" />
      <label class="block text-sm font-medium mb-1.5" for="pf-email">Mailbox you send from</label>
      <input id="pf-email" name="email" type="email" required maxlength="254" placeholder="support@companya.com"
        class="w-full rounded-lg border border-line px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-accent" />
      <fieldset>
        <legend class="block text-sm font-medium mb-2">Colour</legend>
        <div id="colorSwatches" class="flex flex-wrap gap-2"></div>
      </fieldset>
      <p id="profileError" class="hidden text-sm text-red-700 mt-3"></p>
      <div class="flex items-center gap-2 mt-6">
        <button type="button" id="deleteProfileBtn" class="hidden text-sm font-medium text-red-700 hover:bg-red-50 rounded-lg px-3 py-2">Delete profile</button>
        <div class="ml-auto flex gap-2">
          <button type="button" data-close class="rounded-lg px-4 py-2 text-sm font-medium text-muted hover:bg-canvas">Cancel</button>
          <button type="submit" class="rounded-lg bg-accent hover:bg-accent-hover text-white px-4 py-2 text-sm font-medium">Save profile</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- ============================ Contact dialog ============================ -->
  <dialog id="contactDialog" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl p-0 shadow-xl">
    <form id="contactForm" class="p-6">
      <h2 id="contactDialogTitle" class="font-display text-xl font-bold mb-4">New follow-up</h2>
      <input type="hidden" name="id" />
      <div class="grid sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1.5" for="cf-profile">Profile</label>
          <select id="cf-profile" name="profile_id" required class="w-full rounded-lg border border-line px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-accent"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" for="cf-email">Client email</label>
          <input id="cf-email" name="client_email" type="email" required maxlength="254" placeholder="jane@client.com"
            class="w-full rounded-lg border border-line px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" for="cf-name">Client name <span class="text-muted font-normal">(optional)</span></label>
          <input id="cf-name" name="client_name" maxlength="120" placeholder="Jane Tan"
            class="w-full rounded-lg border border-line px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1.5" for="cf-subject">Subject or topic <span class="text-muted font-normal">(optional)</span></label>
          <input id="cf-subject" name="subject" maxlength="300" placeholder="Re: Invoice #2041 refund"
            class="w-full rounded-lg border border-line px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" for="cf-date">Next follow-up</label>
          <input id="cf-date" name="next_followup" type="date" required
            class="w-full rounded-lg border border-line px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" for="cf-cadence">After I send, remind me in</label>
          <select id="cf-cadence" name="cadence_days" class="w-full rounded-lg border border-line px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="1">1 day</option>
            <option value="2">2 days</option>
            <option value="3" selected>3 days</option>
            <option value="5">5 days</option>
            <option value="7">1 week</option>
            <option value="14">2 weeks</option>
            <option value="30">1 month</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1.5" for="cf-notes">Notes for the next email</label>
          <textarea id="cf-notes" name="notes" rows="4" maxlength="20000" placeholder="Confirm the replacement shipped. Ask for the order number if they haven't sent it."
            class="w-full rounded-lg border border-line px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
        </div>
      </div>
      <p id="contactError" class="hidden text-sm text-red-700 mt-3"></p>
      <div class="flex justify-end gap-2 mt-6">
        <button type="button" data-close class="rounded-lg px-4 py-2 text-sm font-medium text-muted hover:bg-canvas">Cancel</button>
        <button type="submit" id="contactSubmit" class="rounded-lg bg-accent hover:bg-accent-hover text-white px-4 py-2 text-sm font-medium">Save follow-up</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 flex flex-col items-end gap-2 pointer-events-none" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- */
  /* Constants                                                         */
  /* ---------------------------------------------------------------- */

  const TOKEN_KEY = 'followup_tracker_token';
  const DAY_MS = 86400000;

  const PROFILE_COLORS = {
    indigo: '#4F46E5', sky: '#0284C7', emerald: '#059669', violet: '#7C3AED',
    rose: '#E11D48', amber: '#D97706', teal: '#0D9488', slate: '#475569',
  };

  // Spec: red = overdue / today, yellow = tomorrow, green = later.
  const URGENCY = {
    overdue:  { stripe: 'bg-red-600',     badge: 'bg-red-100 text-red-800 ring-red-600/30' },
    today:    { stripe: 'bg-red-500',     badge: 'bg-red-50 text-red-700 ring-red-600/25' },
    tomorrow: { stripe: 'bg-amber-400',   badge: 'bg-amber-100 text-amber-900 ring-amber-500/40' },
    later:    { stripe: 'bg-emerald-500', badge: 'bg-emerald-50 text-emerald-800 ring-emerald-600/25' },
    archived: { stripe: 'bg-slate-300',   badge: 'bg-slate-100 text-slate-600 ring-slate-400/30' },
  };

  const BTN_SNOOZE = 'rounded-md px-2.5 py-1.5 text-xs font-medium bg-canvas hover:bg-line text-ink ring-1 ring-line focus:outline-none focus-visible:ring-2 focus-visible:ring-accent';
  const BTN_LINK = 'text-xs font-medium text-muted hover:text-ink rounded px-1.5 py-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent';

  /* ---------------------------------------------------------------- */
  /* State                                                             */
  /* ---------------------------------------------------------------- */

  const state = {
    token: readToken(),
    profiles: [],
    contacts: [],
    profileFilter: 'all',   // 'all' | profile id
    statusFilter: 'active', // 'active' | 'archived'
    bucketFilter: null,     // null | 'attention' | 'overdue' | 'today' | 'tomorrow' | 'later' | 'YYYY-MM-DD'
    search: '',
  };
  const pendingNotes = new Map(); // contactId -> { timer, value }

  const $ = (sel) => document.querySelector(sel);

  /* ---------------------------------------------------------------- */
  /* Utilities                                                         */
  /* ---------------------------------------------------------------- */

  function readToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function writeToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) { /* storage blocked */ } }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const pad = (n) => String(n).padStart(2, '0');
  function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isoToUTC(iso) { const p = iso.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) {
    const t = new Date(isoToUTC(iso) + n * DAY_MS);
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }
  function daysFromToday(iso) { return Math.round((isoToUTC(iso) - isoToUTC(todayISO())) / DAY_MS); }
  function fmtDate(iso, opts) {
    return new Date(isoToUTC(iso)).toLocaleDateString(undefined, Object.assign({ timeZone: 'UTC' }, opts || { weekday: 'short', day: 'numeric', month: 'short' }));
  }
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  function urgencyOf(c) {
    const d = daysFromToday(c.next_followup);
    if (d < 0) return 'overdue';
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    return 'later';
  }

  // Horizon bucket: overdue, today, tomorrow, the next 6 individual dates, then "later".
  function bucketOf(c) {
    const d = daysFromToday(c.next_followup);
    if (d < 0) return 'overdue';
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    if (d <= 7) return c.next_followup;
    return 'later';
  }

  function dueText(c) {
    const d = daysFromToday(c.next_followup);
    if (d < 0) return 'Overdue by ' + plural(-d, 'day');
    if (d === 0) return 'Due today';
    if (d === 1) return 'Due tomorrow';
    return 'Due in ' + d + ' days';
  }

  // Snoozing an overdue item counts from today; otherwise from its current date.
  function snoozeDate(c, days) {
    const t = todayISO();
    const base = c.next_followup > t ? c.next_followup : t;
    return addDays(base, days);
  }

  const profileById = (id) => state.profiles.find((p) => p.id === Number(id));
  const profileColor = (p) => (p && PROFILE_COLORS[p.color]) || '#94A3B8';

  /* ---------------------------------------------------------------- */
  /* API                                                               */
  /* ---------------------------------------------------------------- */

  async function api(method, path, body) {
    const res = await fetch('/api/' + path, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      lock('Your session ended. Enter the password again.');
      throw new Error('Wrong password.');
    }
    if (!res.ok) throw new Error(data.error || 'Request failed with status ' + res.status + '.');
    return data;
  }

  function upsert(list, row) {
    const i = list.findIndex((x) => x.id === row.id);
    if (i === -1) list.push(row); else list[i] = row;
  }

  async function loadData() {
    const data = await api('GET', 'data');
    state.profiles = data.profiles;
    state.contacts = data.contacts;
    if (state.profileFilter !== 'all' && !profileById(state.profileFilter)) state.profileFilter = 'all';
    renderAll();
  }

  async function patchContact(id, changes) {
    const row = await api('PUT', 'contacts/' + id, changes);
    upsert(state.contacts, row);
    return row;
  }

  /* ---------------------------------------------------------------- */
  /* Toasts & clipboard                                                */
  /* ---------------------------------------------------------------- */

  function toast(message, kind) {
    const el = document.createElement('div');
    const tone = kind === 'error' ? 'bg-red-700' : 'bg-ink';
    el.className = 'pointer-events-auto max-w-sm rounded-lg px-4 py-3 text-sm text-white shadow-lg ' + tone;
    el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    el.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), kind === 'error' ? 6000 : 2800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function flashButton(btn, label) {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = label;
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.textContent = original; }, 1500);
  }

  /* ---------------------------------------------------------------- */
  /* Rendering                                                         */
  /* ---------------------------------------------------------------- */

  function contactsInProfile() {
    return state.profileFilter === 'all'
      ? state.contacts
      : state.contacts.filter((c) => c.profile_id === Number(state.profileFilter));
  }

  function matchesBucket(c) {
    const f = state.bucketFilter;
    if (!f) return true;
    if (f === 'attention') return urgencyOf(c) === 'overdue' || urgencyOf(c) === 'today';
    return bucketOf(c) === f;
  }

  function visibleContacts() {
    const q = state.search.trim().toLowerCase();
    const list = contactsInProfile().filter((c) => {
      if (c.status !== state.statusFilter) return false;
      if (state.statusFilter === 'active' && !matchesBucket(c)) return false;
      if (!q) return true;
      return [c.client_name, c.client_email, c.subject, c.notes].some((v) => (v || '').toLowerCase().includes(q));
    });
    if (state.statusFilter === 'active') {
      list.sort((a, b) => a.next_followup.localeCompare(b.next_followup) || (a.client_name || a.client_email).localeCompare(b.client_name || b.client_email));
    } else {
      list.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
    }
    return list;
  }

  function renderAll() {
    $('#todayLabel').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    renderProfiles();
    renderHeadline();
    renderHorizon();
    renderToolbar();
    renderContacts();
  }

  function renderProfiles() {
    const active = state.contacts.filter((c) => c.status === 'active');
    const attention = (list) => list.filter((c) => daysFromToday(c.next_followup) <= 0).length;

    const item = (key, name, sub, color, count, urgent, editable) => {
      const selected = String(state.profileFilter) === String(key);
      const badge = count
        ? '<span class="ml-auto shrink-0 rounded-full px-2 py-0.5 text-xs font-semibold ' +
          (urgent ? 'bg-red-600 text-white' : 'bg-canvas text-muted ring-1 ring-line') + '" title="' +
          (urgent ? esc(urgent + ' due today or overdue') : esc(count + ' open')) + '">' + (urgent || count) + '</span>'
        : '';
      return '<li class="shrink-0 lg:shrink group relative">' +
        '<button data-profile="' + esc(key) + '" class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2 text-left whitespace-nowrap lg:whitespace-normal ring-1 ' +
          (selected ? 'bg-white ring-line shadow-sm' : 'ring-transparent hover:bg-white/70') +
          ' focus:outline-none focus-visible:ring-2 focus-visible:ring-accent">' +
          '<span class="h-2.5 w-2.5 rounded-full shrink-0" style="background:' + color + '"></span>' +
          '<span class="min-w-0' + (editable ? ' lg:pr-6' : '') + '">' +
            '<span class="block text-sm font-medium truncate">' + esc(name) + '</span>' +
            (sub ? '<span class="block text-xs text-muted truncate">' + esc(sub) + '</span>' : '') +
          '</span>' + badge +
        '</button>' +
        (editable
          ? '<button data-edit-profile="' + esc(key) + '" class="hidden lg:block absolute right-10 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 focus:opacity-100 text-xs text-muted hover:text-ink rounded px-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-accent" aria-label="Edit ' + esc(name) + '">Edit</button>'
          : '') +
        '</li>';
    };

    let html = item('all', 'All profiles', plural(state.profiles.length, 'mailbox'), '#16202B', active.length, attention(active), false);
    state.profiles.forEach((p) => {
      const mine = active.filter((c) => c.profile_id === p.id);
      html += item(p.id, p.name, p.email, profileColor(p), mine.length, attention(mine), true);
    });
    $('#profileList').innerHTML = html;
  }

  function renderHeadline() {
    const active = contactsInProfile().filter((c) => c.status === 'active');
    const overdue = active.filter((c) => urgencyOf(c) === 'overdue').length;
    const today = active.filter((c) => urgencyOf(c) === 'today').length;
    const tomorrow = active.filter((c) => urgencyOf(c) === 'tomorrow').length;
    const scope = state.profileFilter === 'all' ? '' : (profileById(state.profileFilter) || {}).name;
    const h = $('#headline');
    const s = $('#subline');

    if (!state.profiles.length) {
      h.textContent = 'Set up your first mailbox';
      s.textContent = 'Add a support profile for each address you send from, then log the client emails you need to chase.';
      return;
    }
    if (overdue + today > 0) {
      h.innerHTML = '<span class="text-red-600">' + (overdue + today) + '</span> ' +
        (overdue + today === 1 ? 'follow-up needs' : 'follow-ups need') + ' you today';
      const parts = [];
      if (overdue) parts.push(overdue + ' overdue');
      if (today) parts.push(today + ' due today');
      if (tomorrow) parts.push(tomorrow + ' coming up tomorrow');
      s.textContent = (scope ? scope + ': ' : '') + parts.join(', ') + '.';
    } else if (active.length) {
      h.textContent = 'Nothing due today';
      s.textContent = (scope ? scope + ': ' : '') + (tomorrow ? tomorrow + ' due tomorrow, ' : '') + plural(active.length, 'open follow-up') + ' in total.';
    } else {
      h.textContent = 'No open follow-ups';
      s.textContent = 'Log a client email with “New follow-up” and pick the date you want to chase it.';
    }
  }

  function renderHorizon() {
    const active = contactsInProfile().filter((c) => c.status === 'active');
    const counts = {};
    active.forEach((c) => { const b = bucketOf(c); counts[b] = (counts[b] || 0) + 1; });
    const t = todayISO();

    const cells = [
      { key: 'overdue', top: 'Overdue', bottom: 'Before today', tone: 'red', wide: true },
      { key: 'today', top: 'Today', bottom: fmtDate(t, { day: 'numeric', month: 'short' }), tone: 'red', wide: true },
      { key: 'tomorrow', top: 'Tomorrow', bottom: fmtDate(addDays(t, 1), { day: 'numeric', month: 'short' }), tone: 'amber', wide: true },
    ];
    for (let i = 2; i <= 7; i++) {
      const iso = addDays(t, i);
      cells.push({ key: iso, top: fmtDate(iso, { weekday: 'short' }), bottom: fmtDate(iso, { day: 'numeric', month: 'short' }), tone: 'green' });
    }
    cells.push({ key: 'later', top: 'Later', bottom: 'After ' + fmtDate(addDays(t, 7), { day: 'numeric', month: 'short' }), tone: 'green', wide: true });

    const tones = {
      red:   { on: 'bg-red-600 text-white ring-red-600', off: 'bg-red-50 text-red-800 ring-red-200', zero: 'bg-white text-muted ring-line' },
      amber: { on: 'bg-amber-400 text-ink ring-amber-400', off: 'bg-amber-50 text-amber-900 ring-amber-200', zero: 'bg-white text-muted ring-line' },
      green: { on: 'bg-emerald-600 text-white ring-emerald-600', off: 'bg-emerald-50 text-emerald-900 ring-emerald-200', zero: 'bg-white text-muted ring-line' },
    };

    $('#horizon').innerHTML = cells.map((cell) => {
      const n = counts[cell.key] || 0;
      const selected = state.bucketFilter === cell.key ||
        (state.bucketFilter === 'attention' && (cell.key === 'overdue' || cell.key === 'today'));
      const cls = selected ? tones[cell.tone].on : (n ? tones[cell.tone].off : tones[cell.tone].zero);
      return '<button data-bucket="' + esc(cell.key) + '" aria-pressed="' + selected + '" ' +
        'class="shrink-0 ' + (cell.wide ? 'w-28' : 'w-20') + ' rounded-xl ring-1 px-3 py-2.5 text-left transition-colors ' + cls +
        ' focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-accent" ' +
        'title="' + esc(plural(n, 'follow-up') + ': ' + cell.top) + '">' +
        '<span class="block text-xs font-semibold">' + esc(cell.top) + '</span>' +
        '<span class="block font-display text-3xl font-extrabold leading-none my-1.5">' + n + '</span>' +
        '<span class="block text-[11px] opacity-80">' + esc(cell.bottom) + '</span>' +
        '</button>';
    }).join('');
  }

  function renderToolbar() {
    document.querySelectorAll('.status-tab').forEach((b) => {
      const on = b.dataset.status === state.statusFilter;
      b.className = 'status-tab px-3 py-1.5 rounded-md font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-accent ' +
        (on ? 'bg-ink text-white' : 'text-muted hover:text-ink');

      chip.className = 'inline-flex items-center gap-2 rounded-full bg-white ring-1 ring-line pl-3 pr-1 py-1 text-sm';

          '<button data-action="sent" class="mt-3 inline-flex items-center gap-1.5 rounded-lg bg-accent hover:bg-accent-hover text-white text-sm font-medium px-3 py-1.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-accent" ' +
            'title="Log that you sent the follow-up and schedule the next one">' +

          '<div class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-1">' +
            '<span class="text-xs text-muted">' + meta.join('<span class="mx-1.5 text-line" aria-hidden="true">|</span>') + '</span>' +

          '<div class="flex items-center justify-between gap-2 mb-1.5">' +

            '<span class="flex items-center gap-2">' +
              '<span data-save-indicator class="text-xs text-muted">' + (pending ? 'Saving…' : '') + '</span>' +
              '<button data-action="copy-notes" class="rounded-md px-2.5 py-1 text-xs font-medium bg-ink text-white hover:bg-black focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:ring-accent">Copy notes</button>' +

  function renderContacts() {
    const list = visibleContacts();
    $('#contactList').innerHTML = list.map(contactCard).join('');

    const empty = $('#emptyState');
    if (list.length) { empty.className = 'hidden'; empty.innerHTML = ''; return; }

    let title, body, cta = '';
    if (!state.profiles.length) {
      title = 'Add a support profile to get started';
      body = 'A profile is a mailbox you reply from, like support@companya.com. Each profile keeps its own list of clients to chase.';
      cta = '<button data-empty-action="profile" class="mt-4 rounded-lg bg-accent hover:bg-accent-hover text-white px-4 py-2 text-sm font-medium">Add support profile</button>';
    } else if (state.search) {
      title = 'No matches for “' + esc(state.search) + '”';
      body = 'Try a different name, address, or phrase from your notes.';
    } else if (state.statusFilter === 'archived') {
      title = 'Nothing archived';
      body = 'Archive a follow-up once the conversation is finished. It stays here if you need to reopen it.';
    } else if (state.bucketFilter) {
      title = 'Nothing due in this slot';
      body = 'Pick another day above, or clear the date filter to see everything.';
    } else {
      title = 'No open follow-ups';
      body = 'Log a client email you need to chase and choose when to remind you.';
      cta = '<button data-empty-action="contact" class="mt-4 rounded-lg bg-accent hover:bg-accent-hover text-white px-4 py-2 text-sm font-medium">New follow-up</button>';
    }
    empty.className = 'rounded-xl border-2 border-dashed border-line bg-white/50 px-6 py-12 text-center';
    empty.innerHTML = '<h3 class="font-display text-lg font-bold">' + title + '</h3><p class="text-muted text-sm mt-1 max-w-md mx-auto">' + body + '</p>' + cta;
  }

  /* ---------------------------------------------------------------- */
  /* Notes autosave                                                    */
  /* ---------------------------------------------------------------- */

  function scheduleNoteSave(id, value, indicator) {
    const entry = pendingNotes.get(id) || {};
    clearTimeout(entry.timer);
    entry.value = value;
    entry.timer = setTimeout(() => saveNote(id), 800);
    pendingNotes.set(id, entry);
    if (indicator) indicator.textContent = 'Saving…';
  }

  async function saveNote(id) {
    const entry = pendingNotes.get(id);
    if (!entry) return;
    clearTimeout(entry.timer);
    pendingNotes.delete(id);
    const indicator = document.querySelector('article[data-id="' + id + '"] [data-save-indicator]');
    try {
      await patchContact(id, { notes: entry.value });
      if (indicator && !pendingNotes.has(id)) indicator.textContent = 'Saved';
    } catch (e) {
      if (indicator) indicator.textContent = 'Not saved';
      toast('Notes not saved: ' + e.message, 'error');
    }
  }

  function flushNotesOnExit() {
    pendingNotes.forEach((entry, id) => {
      clearTimeout(entry.timer);
      fetch('/api/contacts/' + id, {
        method: 'PUT',
        keepalive: true,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token },
        body: JSON.stringify({ notes: entry.value }),
      });
    });
    pendingNotes.clear();
  }

  /* ---------------------------------------------------------------- */
  /* Contact actions                                                   */
  /* ---------------------------------------------------------------- */

  async function handleCardAction(btn, c) {
    const action = btn.dataset.action;
    const card = btn.closest('article');

    if (action === 'copy-notes') {
      const text = card.querySelector('textarea').value;
      if (!text.trim()) { toast('There are no notes to copy yet.'); return; }
      flashButton(btn, (await copyText(text)) ? 'Copied' : 'Copy failed');
      return;
    }
    if (action === 'copy-email') {
      flashButton(btn, (await copyText(c.client_email)) ? 'Copied' : 'Copy failed');
      return;
    }
    if (action === 'edit') { openContactDialog(c); return; }

    btn.disabled = true;
    try {
      if (action === 'snooze') {
        const next = snoozeDate(c, Number(btn.dataset.days));
        await patchContact(c.id, { next_followup: next });
        toast('Snoozed to ' + fmtDate(next) + '.');
      } else if (action === 'sent') {
        if (pendingNotes.has(c.id)) await saveNote(c.id);
        const t = todayISO();
        const next = addDays(t, c.cadence_days);
        await patchContact(c.id, { last_contacted: t, next_followup: next, log_sent: true });
        toast('Marked sent. Next follow-up ' + fmtDate(next) + '.');
      } else if (action === 'archive') {
        if (pendingNotes.has(c.id)) await saveNote(c.id);
        await patchContact(c.id, { status: 'archived' });
        toast('Archived ' + (c.client_name || c.client_email) + '.');
      } else if (action === 'reopen') {
        const changes = { status: 'active' };
        if (c.next_followup < todayISO()) changes.next_followup = todayISO();
        await patchContact(c.id, changes);
        toast('Reopened ' + (c.client_name || c.client_email) + '.');
      } else if (action === 'delete') {
        if (!confirm('Delete the follow-up for ' + (c.client_name || c.client_email) + '? This also deletes its notes and cannot be undone.')) return;
        const entry = pendingNotes.get(c.id);
        if (entry) { clearTimeout(entry.timer); pendingNotes.delete(c.id); }
        await api('DELETE', 'contacts/' + c.id);
        state.contacts = state.contacts.filter((x) => x.id !== c.id);
        toast('Deleted.');
      }
      renderAll();
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------------------------------------------------------------- */
  /* Dialogs                                                           */
  /* ---------------------------------------------------------------- */

  function showError(el, msg) { el.textContent = msg; el.classList.toggle('hidden', !msg); }

  function openProfileDialog(p) {
    const form = $('#profileForm');
    form.reset();
    showError($('#profileError'), '');
    form.elements.id.value = p ? p.id : '';
    form.elements.name.value = p ? p.name : '';
    form.elements.email.value = p ? p.email : '';
    $('#profileDialogTitle').textContent = p ? 'Edit support profile' : 'New support profile';
    $('#deleteProfileBtn').classList.toggle('hidden', !p);

    const current = p ? p.color : Object.keys(PROFILE_COLORS)[state.profiles.length % 8];
    $('#colorSwatches').innerHTML = Object.keys(PROFILE_COLORS).map((k) =>
      '<label class="cursor-pointer">' +
        '<input type="radio" name="color" value="' + k + '" class="peer sr-only"' + (k === current ? ' checked' : '') + ' />' +
        '<span class="block h-8 w-8 rounded-full ring-2 ring-transparent ring-offset-2 peer-checked:ring-ink peer-focus-visible:ring-accent" style="background:' + PROFILE_COLORS[k] + '" title="' + k + '"></span>' +
        '<span class="sr-only">' + k + '</span>' +
      '</label>').join('');

    $('#profileDialog').showModal();
    form.elements.name.focus();
  }

  function openContactDialog(c) {
    if (!state.profiles.length) { openProfileDialog(null); toast('Add a support profile first.'); return; }
    const form = $('#contactForm');
    form.reset();
    showError($('#contactError'), '');
    $('#cf-profile').innerHTML = state.profiles.map((p) =>
      '<option value="' + p.id + '">' + esc(p.name) + ' (' + esc(p.email) + ')</option>').join('');

    const defaultProfile = c ? c.profile_id : (state.profileFilter !== 'all' ? state.profileFilter : state.profiles[0].id);
    form.elements.id.value = c ? c.id : '';
    form.elements.profile_id.value = String(defaultProfile);
    form.elements.client_email.value = c ? c.client_email : '';
    form.elements.client_name.value = c ? c.client_name : '';
    form.elements.subject.value = c ? c.subject : '';
    form.elements.next_followup.value = c ? c.next_followup : addDays(todayISO(), 1);
    const pending = c && pendingNotes.get(c.id);
    form.elements.notes.value = c ? (pending ? pending.value : c.notes) : '';

    const cadence = String(c ? c.cadence_days : 3);
    const sel = form.elements.cadence_days;
    if (![].some.call(sel.options, (o) => o.value === cadence)) {
      sel.add(new Option(plural(Number(cadence), 'day'), cadence));
    }
    sel.value = cadence;

    $('#contactDialogTitle').textContent = c ? 'Edit follow-up' : 'New follow-up';
    $('#contactSubmit').textContent = c ? 'Save changes' : 'Save follow-up';
    $('#contactDialog').showModal();
    (c ? form.elements.client_email : form.elements.client_email).focus();
  }

  async function submitProfile(e) {
    e.preventDefault();
    const form = e.target;
    const id = form.elements.id.value;
    const checked = form.querySelector('input[name="color"]:checked');
    const body = { name: form.elements.name.value, email: form.elements.email.value, color: checked ? checked.value : 'indigo' };
    try {
      const row = id ? await api('PUT', 'profiles/' + id, body) : await api('POST', 'profiles', body);
      upsert(state.profiles, row);
      state.profiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
      $('#profileDialog').close();
      if (!id) state.profileFilter = row.id;
      renderAll();
      toast(id ? 'Profile saved.' : 'Profile added. Now log a client email to follow up.');
    } catch (err) {
      showError($('#profileError'), err.message);
    }
  }

  async function deleteProfile() {
    const id = Number($('#profileForm').elements.id.value);
    const p = profileById(id);
    if (!p) return;
    const n = state.contacts.filter((c) => c.profile_id === id).length;
    if (!confirm('Delete "' + p.name + '"' + (n ? ' and its ' + plural(n, 'follow-up') : '') + '? This cannot be undone.')) return;
    try {
      await api('DELETE', 'profiles/' + id);
      state.profiles = state.profiles.filter((x) => x.id !== id);
      state.contacts = state.contacts.filter((c) => c.profile_id !== id);
      if (String(state.profileFilter) === String(id)) state.profileFilter = 'all';
      $('#profileDialog').close();
      renderAll();
      toast('Profile deleted.');
    } catch (err) {
      showError($('#profileError'), err.message);
    }
  }

  async function submitContact(e) {
    e.preventDefault();
    const f = e.target.elements;
    const id = f.id.value ? Number(f.id.value) : null;
    const body = {
      profile_id: Number(f.profile_id.value),
      client_email: f.client_email.value,
      client_name: f.client_name.value,
      subject: f.subject.value,
      next_followup: f.next_followup.value,
      cadence_days: Number(f.cadence_days.value),
      notes: f.notes.value,
    };
    try {
      if (id) {
        const entry = pendingNotes.get(id);
        if (entry) { clearTimeout(entry.timer); pendingNotes.delete(id); }
        await patchContact(id, body);
      } else {
        const row = await api('POST', 'contacts', body);
        upsert(state.contacts, row);
        if (state.statusFilter !== 'active') state.statusFilter = 'active';
        state.bucketFilter = null;
      }
      $('#contactDialog').close();
      renderAll();
      toast(id ? 'Changes saved.' : 'Follow-up saved for ' + fmtDate(body.next_followup) + '.');
    } catch (err) {
      showError($('#contactError'), err.message);
    }
  }

  /* ---------------------------------------------------------------- */
  /* Auth & bootstrap                                                  */
  /* ---------------------------------------------------------------- */

  function showLogin(message) {
    $('#appView').classList.add('hidden');
    $('#loginView').classList.remove('hidden');
    showError($('#loginError'), message || '');
    $('#loginPassword').value = '';
    $('#loginPassword').focus();
  }

  function lock(message) {
    flushNotesOnExit();
    state.token = '';
    writeToken('');
    state.profiles = [];
    state.contacts = [];
    showLogin(message);
  }

  async function enterApp() {
    $('#loginView').classList.add('hidden');
    $('#appView').classList.remove('hidden');
    try {
      await loadData();
    } catch (e) {
      if (state.token) toast('Could not load your follow-ups: ' + e.message, 'error');
    }
  }

  async function tryLogin(password) {
    const res = await fetch('/api/auth/check', { headers: { Authorization: 'Bearer ' + password } });
    if (res.ok) return true;
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || 'Sign-in failed with status ' + res.status + '.');
  }

  async function exportBackup() {
    try {
      const data = await api('GET', 'export');
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'followup-tracker-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Backup downloaded.');
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function bindEvents() {
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('#loginPassword').value;
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await tryLogin(pw);
        state.token = pw;
        writeToken(pw);
        await enterApp();
      } catch (err) {
        showError($('#loginError'), err.message);
      } finally {
        btn.disabled = false;
      }
    });

    $('#lockBtn').addEventListener('click', () => lock(''));
    $('#exportBtn').addEventListener('click', exportBackup);
    $('#newContactBtn').addEventListener('click', () => openContactDialog(null));
    $('#newProfileBtn').addEventListener('click', () => openProfileDialog(null));
    $('#profileForm').addEventListener('submit', submitProfile);
    $('#contactForm').addEventListener('submit', submitContact);
    $('#deleteProfileBtn').addEventListener('click', deleteProfile);
    document.querySelectorAll('dialog [data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));

    $('#profileList').addEventListener('click', (e) => {
      const edit = e.target.closest('[data-edit-profile]');
      if (edit) { openProfileDialog(profileById(edit.dataset.editProfile)); return; }
      const btn = e.target.closest('[data-profile]');
      if (!btn) return;
      const key = btn.dataset.profile;
      // Clicking the selected profile again opens its settings (handy on touch screens).
      if (key !== 'all' && String(state.profileFilter) === key) { openProfileDialog(profileById(key)); return; }
      state.profileFilter = key === 'all' ? 'all' : Number(key);
      renderAll();
    });

    $('#horizon').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-bucket]');
      if (!btn) return;
      const key = btn.dataset.bucket;
      state.bucketFilter = state.bucketFilter === key ? null : key;
      state.statusFilter = 'active';
      renderAll();
    });

    document.querySelectorAll('.status-tab').forEach((b) => b.addEventListener('click', () => {
      state.statusFilter = b.dataset.status;
      renderAll();
    }));

    $('#filterChip').addEventListener('click', (e) => {
      if (e.target.id === 'clearBucket') { state.bucketFilter = null; renderAll(); }
    });

    let searchTimer;
    $('#searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.search = e.target.value; renderContacts(); }, 150);
    });

    $('#emptyState').addEventListener('click', (e) => {
      const b = e.target.closest('[data-empty-action]');
      if (!b) return;
      if (b.dataset.emptyAction === 'profile') openProfileDialog(null); else openContactDialog(null);
    });

    const list = $('#contactList');
    const contactFor = (el) => {
      const card = el.closest('article[data-id]');
      return card ? state.contacts.find((c) => c.id === Number(card.dataset.id)) : null;
    };

    list.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const c = contactFor(btn);
      if (c) handleCardAction(btn, c);
    });

    list.addEventListener('input', (e) => {
      if (e.target.dataset.action !== 'notes') return;
      const c = contactFor(e.target);
      if (c) scheduleNoteSave(c.id, e.target.value, e.target.closest('article').querySelector('[data-save-indicator]'));
    });

    list.addEventListener('focusout', (e) => {
      if (e.target.dataset.action !== 'notes') return;
      const c = contactFor(e.target);
      if (c && pendingNotes.has(c.id)) saveNote(c.id);
    });

    list.addEventListener('change', async (e) => {
      if (e.target.dataset.action !== 'date') return;
      const c = contactFor(e.target);
      const value = e.target.value;
      if (!c || !value || value === c.next_followup) return;
      try {
        await patchContact(c.id, { next_followup: value });
        toast('Next follow-up set for ' + fmtDate(value) + '.');
        renderAll();
      } catch (err) {
        e.target.value = c.next_followup;
        toast(err.message, 'error');
      }
    });

    // Keyboard shortcut: "n" for a new follow-up when not typing.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'n' || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag) || document.querySelector('dialog[open]') || $('#appView').classList.contains('hidden')) return;
      e.preventDefault();
      openContactDialog(null);
    });

    // Save unsent notes when the tab closes, and resync when you come back to it.
    window.addEventListener('pagehide', flushNotesOnExit);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { pendingNotes.forEach((_, id) => saveNote(id)); return; }
      const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (state.token && !pendingNotes.size && !typing && !document.querySelector('dialog[open]')) {
        loadData().catch(() => {});
      }
    });

    // Re-colour everything when the date rolls over at midnight.
    let lastDay = todayISO();
    setInterval(() => {
      if (todayISO() === lastDay) return;
      lastDay = todayISO();
      const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (!typing && state.token) renderAll();
    }, 60000);
  }

  bindEvents();
  if (state.token) enterApp(); else showLogin('');
})();
</script>
</body>
</html>
